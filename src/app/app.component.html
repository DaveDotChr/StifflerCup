<mat-toolbar class="max-h-14 !pl-0">
  <div class="w-14 flex justify-center">
    <button mat-icon-button color="accent">
      <mat-icon>menu</mat-icon>
    </button>
  </div>
  <div class="flex items-center justify-between w-[calc(100%-3.5rem)]">
    <div class="mr-2 ml-2">{{currentPage}}</div>
    <!-- <button mat-mini-fab routerLink="create">
      <mat-icon> build </mat-icon>
    </button> -->
    <div class="flex items-center">
      @if(userService.currentUser){
        <div>Hallo {{userService.currentUser.getUsername()}}</div>
      } @else {
        Anonym
      }
      <button cdkOverlayOrigin (click)="isLoginOverlayOpen = !isLoginOverlayOpen" #trigger="cdkOverlayOrigin" class="ml-4" mat-mini-fab>
        <mat-icon> person </mat-icon>
      </button>
    </div>
    <ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="trigger" [cdkConnectedOverlayOpen]="isLoginOverlayOpen" [cdkconnected]>
      @if(!userService.$loggedIn.getValue()){
        <app-login></app-login>
      } @else {
        <div>
          <div (click)="userService.logOut()">
            Logout
          </div>
        </div>
      }
    </ng-template>
  </div>
</mat-toolbar>
<div class="h-[calc(100%_-_3.5rem)]">
  <mat-drawer-container class="h-full">
    <mat-drawer mode="side" disableClose="true" opened>
      <div class="flex flex-col">
        <!-- <button mat-mini-fab class="navbutton" routerLink="/create/createCup" color="primary">
          <mat-icon> width_normal </mat-icon>
        </button> -->
        <button mat-mini-fab class="navbutton" routerLink="/create/createFrage" color="primary">
          <mat-icon> quiz </mat-icon>
        </button>
        <button mat-mini-fab class="navbutton" routerLink="" color="primary">
          <mat-icon> home </mat-icon>
        </button>
      </div>
    </mat-drawer>
    <mat-drawer-content>
      <router-outlet></router-outlet>
    </mat-drawer-content>
  </mat-drawer-container>
</div>
